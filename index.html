<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アイカツ！アンコール 1弾 カード所持チェックリスト(全61枚)</title>
<style>
  :root {
    --pink: #fb9fd6;
    --pink-dark: #e56bb5;
    --bg: #fff7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: #333;
    padding: 16px;
  }
  h1 {
    font-size: 1.2rem;
    color: var(--pink-dark);
    text-align: center;
    margin: 4px 0 2px;
  }
  .sub {
    text-align: center;
    font-size: 0.85rem;
    color: #999;
    margin-bottom: 12px;
  }
  .progress-wrap {
    max-width: 480px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .progress-count { color: var(--pink-dark); font-weight: bold; }
  .bar-bg {
    background: #f0e0ec;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    background: var(--pink);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
    user-select: none;
  }
  .card.owned {
    border-color: var(--pink);
    background: #fff0f8;
  }
  .card img {
    width: 100%;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
    background: #eee;
    aspect-ratio: 63 / 88;
    object-fit: cover;
  }
  .card.owned img { opacity: 0.55; }
  .card-id {
    font-size: 0.75rem;
    font-weight: bold;
    color: #555;
  }
  .card.owned .card-id { color: var(--pink-dark); }
  .card-name {
    font-size: 0.68rem;
    color: #777;
    margin-top: 2px;
    line-height: 1.3;
  }
  .checkmark {
    font-size: 0.75rem;
    color: var(--pink-dark);
    height: 14px;
  }
  .rarity {
    font-size: 0.65rem;
    color: #aaa;
  }
  .loading {
    text-align: center;
    color: #aaa;
    padding: 40px 0;
  }
  .reset-btn {
    display: block;
    margin: 20px auto 0;
    padding: 8px 20px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    color: #888;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reset-btn:active { background: #f5f5f5; }
  .status {
    max-width: 480px;
    margin: 10px auto 0;
    text-align: center;
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 8px;
    display: none;
  }
  .status.show { display: block; }
  .status.error { background: #ffe5e5; color: #c0392b; }
  .status.ok { background: #e6f7ec; color: #2e7d4f; }
</style>
</head>
<body>

<h1>アイカツ！アンコール 1弾</h1>
<div class="sub">カード所持チェックリスト(全61枚)</div>

<div class="progress-wrap">
  <div class="progress-text">
    <span>所持数</span>
    <span class="progress-count"><span id="ownedCount">0</span> / 61</span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
</div>

<div id="grid" class="grid">
  <div class="loading">読み込み中...</div>
</div>

<button class="reset-btn" id="resetBtn">チェックをすべてリセット</button>

<div class="status" id="status"></div>

<script>
const cards = [

  { id: "E1-06", rarity: "R", name: "アイスブルーフリルパニエ" },
  { id: "E1-07", rarity: "R", name: "アイスブルーシューズ" },
  { id: "E1-08", rarity: "R", name: "ジュエルつきパープルリボン" },
  { id: "E1-09", rarity: "R", name: "小花柄イエローワンピ" },
  { id: "E1-10", rarity: "R", name: "ドリーミースタートップス" },
  { id: "E1-11", rarity: "R", name: "ドリーミースタースカート" },
  { id: "E1-12", rarity: "R", name: "ドリーミースターパンプス" },
  { id: "E1-13", rarity: "R", name: "チャーミーリボントップス" },
  { id: "E1-14", rarity: "R", name: "チャーミーリボンスカート" },
  { id: "E1-15", rarity: "R", name: "チャーミーリボンサンダル" },
  { id: "E1-16", rarity: "R", name: "チャーミーリボンアクセ" },
  { id: "E1-17", rarity: "R", name: "クリアネスイエロートップス" },
  { id: "E1-18", rarity: "R", name: "クリアネスイエロースカート" },
  { id: "E1-19", rarity: "R", name: "クリアネスイエローパンプス" },
  { id: "E1-20", rarity: "R", name: "クリアネスイエローアクセ" },
  { id: "E1-21", rarity: "N", name: "ピンクステージベスト" },
  { id: "E1-22", rarity: "N", name: "ピンクステージスカート" },
  { id: "E1-23", rarity: "N", name: "ピンクステージシューズ" },
  { id: "E1-24", rarity: "N", name: "パフスリーブレモンカラーブラウス" },
  { id: "E1-25", rarity: "N", name: "ラベンダーフリルスカート" },
  { id: "E1-26", rarity: "N", name: "イエロー編み上げブーツ" },
  { id: "E1-27", rarity: "N", name: "ピンクブロッサムトップス" },
  { id: "E1-28", rarity: "N", name: "ピンクブロッサムスカート" },
  { id: "E1-29", rarity: "N", name: "ピンクブロッサムブーツ" },
  { id: "E1-37", rarity: "R", name: "プリズムサイバーグラフィックワンピ" },
  { id: "E1-38", rarity: "R", name: "ブラックモダンボレロ" },
  { id: "E1-39", rarity: "R", name: "ブラックフューチャーエナメルショートパンツ" },
  { id: "E1-40", rarity: "R", name: "ブラックフューチャーブーツ" },
  { id: "E1-41", rarity: "N", name: "ブルーステージブラウス" },
  { id: "E1-42", rarity: "N", name: "ブルーステージスカート" },
  { id: "E1-43", rarity: "N", name: "ブルーステージブーツ" },

  { id: "E1-45", rarity: "N", name: "ダイヤモンドチェックスカート" },
  { id: "E1-46", rarity: "N", name: "ブルーストラップシューズ" },
  { id: "E1-47", rarity: "N", name: "ネイビーブロッサムトップス" },
  { id: "E1-48", rarity: "N", name: "ネイビーブロッサムスカート" },
  { id: "E1-49", rarity: "N", name: "ネイビーブロッサムブーツ" },
  { id: "E1-51", rarity: "PR", name: "レジェンダリールージュドレス" },
  { id: "E1-52", rarity: "PR", name: "レジェンダリールージュパンプス" },
  { id: "E1-53", rarity: "R", name: "アゲハレッドコクーンワンピ" },
  { id: "E1-54", rarity: "R", name: "アゲハレッドミュール" },
  { id: "E1-55", rarity: "R", name: "パープルジュエリーワンピ" },
  { id: "E1-56", rarity: "R", name: "ゴールドチェーングラディエーター" },
  { id: "E1-57", rarity: "R", name: "アゲハロゴフリルトップス" },
  { id: "E1-58", rarity: "R", name: "アゲハファーつきスカート" },
  { id: "E1-59", rarity: "R", name: "ブラックシフォンカチューシャ" },
  { id: "E1-60", rarity: "N", name: "パープルステージトップス" },
  { id: "E1-61", rarity: "N", name: "パープルステージスカート" },
  { id: "E1-62", rarity: "N", name: "パープルステージニーハイパンプス" },
  { id: "E1-63", rarity: "N", name: "プッチがらシャイニングトップス" },
  { id: "E1-64", rarity: "N", name: "ブラックウォッシュデニムミニ" },
  { id: "E1-65", rarity: "N", name: "セクシーロゴチューブトップ" },
  { id: "E1-66", rarity: "N", name: "ベルトつきレザースカート" },
  { id: "E1-67", rarity: "N", name: "サイハイレザーブーツ" },
  { id: "E1-68", rarity: "N", name: "パープルブロッサムトップス" },
  { id: "E1-69", rarity: "N", name: "パープルブロッサムスカート" },
  { id: "E1-70", rarity: "N", name: "パープルブロッサムブーツ" },
  { id: "E1-83", rarity: "N", name: "イエローブロッサムトップス" },
  { id: "E1-84", rarity: "N", name: "イエローブロッサムスカート" },
  { id: "E1-85", rarity: "N", name: "イエローブロッサムブーツ" }
];

const STORAGE_KEY = "aikatsu-encore-e1-owned";
let ownedSet = new Set();

function imgUrl(card) {
  return `https://dcd.aikatsu.com/encore/images/cardlist/card/${card.id}_${card.rarity}.webp`;
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  cards.forEach(card => {
    const key = `${card.id}_${card.rarity}`;
    const owned = ownedSet.has(key);
    const el = document.createElement("div");
    el.className = "card" + (owned ? " owned" : "");
    el.innerHTML = `
      <img src="${imgUrl(card)}" alt="${key}" loading="lazy">
      <div class="card-id">${card.id}</div>
      <div class="card-name">${card.name}</div>
      <div class="rarity">${card.rarity === "PR" ? "プレミアムレア" : card.rarity === "R" ? "レア" : "ノーマル"}</div>
      <div class="checkmark">${owned ? "✓ 所持" : ""}</div>
    `;
    el.addEventListener("click", () => toggle(key));
    grid.appendChild(el);
  });
  updateProgress();
}

function updateProgress() {
  const count = ownedSet.size;
  document.getElementById("ownedCount").textContent = count;
  document.getElementById("barFill").style.width = (count / cards.length * 100) + "%";
}

function toggle(key) {
  if (ownedSet.has(key)) ownedSet.delete(key);
  else ownedSet.add(key);
  render();
  save();
}

function showStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status show " + type;
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...ownedSet]));
    showStatus("保存しました(" + ownedSet.size + "枚)", "ok");
  } catch (e) {
    showStatus("保存エラー: " + (e && e.message ? e.message : String(e)), "error");
  }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      ownedSet = new Set(JSON.parse(raw));
      showStatus("読み込みました(" + ownedSet.size + "枚)", "ok");
    }
  } catch (e) {
    // 初回(まだ何も保存していない)はここに来るのが正常
  }
  render();
}

let resetArmed = false;
document.getElementById("resetBtn").addEventListener("click", () => {
  const btn = document.getElementById("resetBtn");
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = "本当にリセットする?(もう一度タップ)";
    btn.style.color = "#c0392b";
    btn.style.borderColor = "#f5b7b1";
    setTimeout(() => {
      if (resetArmed) {
        resetArmed = false;
        btn.textContent = "チェックをすべてリセット";
        btn.style.color = "";
        btn.style.borderColor = "";
      }
    }, 3000);
    return;
  }
  resetArmed = false;
  btn.textContent = "チェックをすべてリセット";
  btn.style.color = "";
  btn.style.borderColor = "";
  ownedSet = new Set();
  render();
  save();
  showStatus("リセットしました", "ok");
});

load();
</script>

</body>
</html>
